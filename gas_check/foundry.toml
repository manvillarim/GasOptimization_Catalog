# Compiler configuration for the gas benchmarks.
#
# solc and the EVM target are pinned so that a re-run reproduces the published
# numbers. Both values are the ones shipped with the AAVE V3 repository used in
# the case study, so the catalogue benchmarks and the case-study measurements
# are taken under the same compiler.

[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.22"
evm_version = "shanghai"
bytecode_hash = "none"
# "Standard" in the paper: optimiser at 200 runs, legacy code generator.
optimizer = true
optimizer_runs = 200

[profile.viair]
src = "src"
out = "out-viair"
test = "test"
libs = ["lib"]
solc = "0.8.22"
evm_version = "shanghai"
bytecode_hash = "none"
# "Via-IR" in the paper: the same optimiser budget through the Yul IR pipeline.
# optimizer_runs is held at 200 in both profiles, so any difference between the
# two is attributable to the code generator.
optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 1000
max_test_rejects = 20000
